# Optional overlay for services on the existing Carpenters Docker network.
# Usage: docker compose -f compose.yaml -f compose.external.yaml up -d --build design-backend design-worker design-frontend
services:
  design-backend:
    networks: [default, traefik, suite-moebel-design, carpenters]
  design-worker:
    networks: [default, traefik, carpenters]

networks:
  carpenters:
    external: true
    name: ${CARPENTERS_NETWORK}
